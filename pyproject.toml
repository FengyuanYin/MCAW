[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traceguard"
version = "0.1.0"
description = "MCAW: Message-Conditioned Adversarial Watermarking for Traceable Talking-Head Immunization"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24,<2.0",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "torch>=2.1",
  "torchvision>=0.16",
]

[project.optional-dependencies]
wam = ["einops>=0.8", "omegaconf>=2.3", "timm>=0.9"]
hallo = [
  "accelerate>=0.28",
  "diffusers>=0.27,<0.30",
  "einops>=0.7",
  "insightface>=0.7",
  "omegaconf>=2.3",
  "transformers>=4.38,<4.43",
]
metrics = ["lpips>=0.1.4", "opencv-python-headless>=4.8"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
traceguard = "traceguard.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
